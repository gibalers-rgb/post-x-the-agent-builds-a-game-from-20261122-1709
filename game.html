<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake — one prompt, one game</title>
<style>
  /* Neon Snake: the game the video's agent builds from a single prompt.
     Plain HTML + canvas + JS. No libraries, no build step, no network. */
  :root { --pink: #ff2e9a; --green: #2bff88; --ink: #eef0f2; --dim: #8b8b9e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #1a0b2e 0%, #08070d 60%);
    color: var(--ink);
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; min-height: 100vh; padding: 16px;
  }
  h1 { font-size: 30px; letter-spacing: 6px; color: var(--green);
       text-shadow: 0 0 22px rgba(43,255,136,.7); }
  h1 em { font-style: normal; color: var(--pink); text-shadow: 0 0 22px rgba(255,46,154,.7); }
  .tag { color: var(--dim); font-size: 13px; }
  .tag b { color: var(--ink); }
  #hud {
    width: 900px; max-width: 96vw; display: flex; justify-content: space-between;
    font-size: 15px; letter-spacing: 2px;
  }
  #hud .score { color: var(--green); }
  #hud .best { color: var(--dim); }
  #stage {
    position: relative; border: 2px solid var(--pink); border-radius: 12px; overflow: hidden;
    box-shadow: 0 0 40px rgba(255,46,154,.35), inset 0 0 30px rgba(0,0,0,.55);
  }
  canvas { display: block; background: #0b0912; }
  #hint { color: var(--dim); font-size: 12px; letter-spacing: 1px; text-align: center; }
  #hint kbd { color: var(--ink); border: 1px solid #444; border-radius: 4px; padding: 0 5px; }
</style>
</head>
<body>
  <h1>NEON <em>SNAKE</em></h1>
  <p class="tag">Built by an AI agent from one prompt: <b>"Build me a tiny browser game — Snake, neon grid, arrow keys to play."</b></p>
  <div id="hud">
    <span class="score" id="score">SCORE 0</span>
    <span id="speed">SPEED ×1.0</span>
    <span class="best" id="best">BEST 0</span>
  </div>
  <div id="stage"><canvas id="game" width="900" height="540"></canvas></div>
  <p id="hint"><kbd>←↑↓→</kbd> / <kbd>WASD</kbd> / swipe steer &nbsp;·&nbsp; <kbd>Space</kbd> pause &nbsp;·&nbsp; <kbd>A</kbd> auto-play demo &nbsp;·&nbsp; <kbd>R</kbd> restart</p>
<script>
"use strict";
/* Neon Snake — grid logic, rendering and a tiny auto-player in one file. */

const CELL = 30;                 // px per grid cell
const COLS = 30, ROWS = 18;      // 900 x 540 playfield
const START_TICKS = 8;           // moves per second at the start
const MAX_TICKS = 18;            // speed cap as the snake eats
const POINTS_PER_DOT = 10;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const speedEl = document.getElementById("speed");
const bestEl = document.getElementById("best");

const DIRS = {
  up:    { x: 0, y: -1 }, down:  { x: 0, y: 1 },
  left:  { x: -1, y: 0 }, right: { x: 1, y: 0 },
};
const KEYS = {
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
};

let snake, dir, queued, dot, score, best, alive, paused, auto, timer;

function freshState() {
  snake = [{ x: 8, y: 9 }, { x: 7, y: 9 }, { x: 6, y: 9 }];
  dir = DIRS.right;
  queued = [];
  score = 0;
  alive = true;
  paused = false;
  auto = false;
  dot = spawnDot();
  drawHUD();
}

function bestScore() {
  try { return Number(localStorage.getItem("neon-snake-best") || 0); } catch (e) { return 0; }
}
function saveBest() {
  try { localStorage.setItem("neon-snake-best", String(best)); } catch (e) { /* private mode */ }
}
best = bestScore();

function freeCells() {
  const taken = new Set(snake.map((s) => s.x + "," + s.y));
  const out = [];
  for (let x = 0; x < COLS; x++)
    for (let y = 0; y < ROWS; y++)
      if (!taken.has(x + "," + y)) out.push({ x, y });
  return out;
}
function spawnDot() {
  const free = freeCells();
  return free[Math.floor(Math.random() * free.length)] || { x: COLS - 2, y: 1 };
}

function turn(next) {
  if (!alive || paused) return;
  const last = queued.length ? queued[queued.length - 1] : dir;
  // No 180-degree turns: the snake would eat itself.
  if (next.x === -last.x && next.y === -last.y) return;
  if (next !== last) queued.push(next);
}

function step() {
  if (!alive || paused) return;
  if (auto) queued.push(autoMove());
  if (queued.length) dir = queued.shift();
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS || hitsSelf(head)) {
    alive = false;
    if (score > best) { best = score; saveBest(); }
    drawHUD();
    render();
    return;
  }
  snake.unshift(head);
  if (head.x === dot.x && head.y === dot.y) {
    score += POINTS_PER_DOT;
    if (score > best) { best = score; saveBest(); }
    dot = spawnDot();
  } else {
    snake.pop();
  }
  drawHUD();
  render();
}

function hitsSelf(cell) {
  return snake.some((s) => s.x === cell.x && s.y === cell.y);
}

/* Auto-player: try every legal direction, keep the ones that leave the snake
   room to move (flood-fill count), and among those take the one that gets
   closest to the dot. Good enough to play a real game on its own. */
function autoMove() {
  const head = snake[0];
  const options = Object.values(DIRS).filter(
    (d) => !(d.x === -dir.x && d.y === -dir.y),
  );
  let pick = dir, pickScore = -Infinity;
  for (const d of options) {
    const next = { x: head.x + d.x, y: head.y + d.y };
    if (next.x < 0 || next.y < 0 || next.x >= COLS || next.y >= ROWS) continue;
    if (hitsSelf(next)) continue;
    const room = floodRoom(next);
    if (room < snake.length) continue; // would trap itself
    const dist = Math.abs(next.x - dot.x) + Math.abs(next.y - dot.y);
    const value = room - dist * 10;
    if (value > pickScore) { pickScore = value; pick = d; }
  }
  return pick;
}

function floodRoom(from) {
  const blocked = new Set(snake.map((s) => s.x + "," + s.y));
  blocked.delete(snake[snake.length - 1].x + "," + snake[snake.length - 1].y); // tail moves away
  const seen = new Set([from.x + "," + from.y]);
  const stack = [from];
  while (stack.length) {
    const c = stack.pop();
    for (const d of Object.values(DIRS)) {
      const n = { x: c.x + d.x, y: c.y + d.y };
      const key = n.x + "," + n.y;
      if (n.x < 0 || n.y < 0 || n.x >= COLS || n.y >= ROWS) continue;
      if (blocked.has(key) || seen.has(key)) continue;
      seen.add(key);
      stack.push(n);
    }
  }
  return seen.size;
}

function ticksPerSecond() {
  return Math.min(MAX_TICKS, START_TICKS + Math.floor(score / 50));
}
function loop() {
  clearTimeout(timer);
  step();
  timer = setTimeout(loop, 1000 / ticksPerSecond());
}

function drawHUD() {
  scoreEl.textContent = "SCORE " + score;
  bestEl.textContent = "BEST " + best;
  speedEl.textContent = "SPEED ×" + (ticksPerSecond() / START_TICKS).toFixed(1) + (auto ? " · AUTO" : "");
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // Faint neon grid.
  ctx.strokeStyle = "rgba(120, 90, 180, 0.13)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 1; x < COLS; x++) { ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); }
  for (let y = 1; y < ROWS; y++) { ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); }
  ctx.stroke();
  // The dot: hot pink, glowing.
  ctx.fillStyle = "#ff2e9a";
  ctx.shadowColor = "#ff2e9a";
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.arc(dot.x * CELL + CELL / 2, dot.y * CELL + CELL / 2, CELL * 0.32, 0, Math.PI * 2);
  ctx.fill();
  // The snake: bright head fading to deep green tail, glowing.
  ctx.shadowColor = "#2bff88";
  snake.forEach((seg, i) => {
    const t = 1 - i / snake.length;
    ctx.fillStyle = i === 0 ? "#c8ffe2" : `rgb(20, ${Math.round(140 + 115 * t)}, 90)`;
    ctx.shadowBlur = i === 0 ? 22 : 12;
    const pad = 2;
    ctx.fillRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
  });
  ctx.shadowBlur = 0;
  if (!alive) {
    ctx.fillStyle = "rgba(5, 4, 10, 0.72)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ff2e9a";
    ctx.font = "bold 44px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 8);
    ctx.fillStyle = "#eef0f2";
    ctx.font = "20px ui-monospace, Menlo, monospace";
    ctx.fillText(`Score ${score} — press R to play again`, canvas.width / 2, canvas.height / 2 + 34);
  } else if (paused) {
    ctx.fillStyle = "rgba(5, 4, 10, 0.6)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#eef0f2";
    ctx.font = "bold 34px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center";
    ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
  }
}

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); if (alive) { paused = !paused; render(); } return; }
  if (e.code === "KeyR") { freshState(); render(); return; }
  if (e.code === "KeyA" && !e.metaKey && !e.ctrlKey) { auto = !auto; drawHUD(); return; }
  const next = KEYS[e.code];
  if (next) { e.preventDefault(); turn(DIRS[next]); }
});

// Swipe to steer on touch screens: a short drag in one direction turns the
// snake that way, same rules as the keys (no 180-degree turns).
let touchStart = null;
canvas.addEventListener("touchstart", (e) => {
  const t = e.changedTouches[0];
  touchStart = { x: t.clientX, y: t.clientY };
  e.preventDefault();
}, { passive: false });
canvas.addEventListener("touchend", (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
  touchStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; // a tap, not a swipe
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIRS.right : DIRS.left)
                                   : (dy > 0 ? DIRS.down : DIRS.up));
  e.preventDefault();
}, { passive: false });

freshState();
render();
loop();
</script>
</body>
</html>
